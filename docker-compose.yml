services:
  mysql:
    image: mysql:8.4
    container_name: attendance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-attendance_db}
      MYSQL_USER: ${DB_USERNAME:-attendance_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [attendance]

  backend:
    build:
      context: ./backend
    container_name: attendance-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-attendance_db}
      DB_USERNAME: ${DB_USERNAME:-attendance_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Kolkata}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - '${SERVER_PORT:-8080}:8080'
    networks: [attendance]

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin through the nginx proxy, so no CORS in this topology.
        VITE_API_BASE_URL: /api/v1
    container_name: attendance-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    networks: [attendance]

volumes:
  mysql-data:

networks:
  attendance:
    driver: bridge
