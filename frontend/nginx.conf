server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to anyone scanning.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx does NOT merge add_header down into a location that declares its own.
    # Setting Cache-Control inside /assets/ silently dropped every security
    # header for exactly the files a browser executes. Repeating them in each
    # block is verbose but it is the behaviour nginx actually has.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves clients pointing at asset files that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;

        # HTTP/1.1 to the upstream, or nginx falls back to 1.0 and cannot
        # forward a chunked response. Report exports are streamed and chunked,
        # so on 1.0 they arrive truncated or not at all.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An export of tens of thousands of rows takes longer than the default
        # 60s, and buffering it would defeat the point of streaming it.
        proxy_read_timeout 300s;
        proxy_buffering off;

        # Enough for a bulk-import CSV; the API enforces its own row limits.
        client_max_body_size 12m;
    }

    # Client-side routing: unknown paths fall through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
