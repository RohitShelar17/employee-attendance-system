<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page paint under the notch and the home
      indicator, and is what makes env(safe-area-inset-*) return anything
      other than zero on iOS. The app shell pads itself back off those
      edges; see .pad-safe-* in styles.css.

      No maximum-scale or user-scalable=no: pinch-zoom is an accessibility
      feature, and the 16px input rule already stops the unwanted zoom it
      is usually used to suppress.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#00236f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      display=block, not swap. For an icon font, "swap" paints the fallback
      immediately - which renders the ligature *name* ("person", "lock") as
      literal text until the font arrives. "block" keeps the glyph invisible
      for a short blocking period instead.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <title>Attendance Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
