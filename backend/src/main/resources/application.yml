spring:
  application:
    name: attendance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      pool-name: attendance-pool

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway in every environment. Never 'update'.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true

app:
  jwt:
    # MUST be overridden in every non-dev environment. Minimum 64 bytes for HS512.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1jaGFuZ2UtbWUtbm93LTEyMzQ1Njc4OTA=}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    issuer: attendance-api

  security:
    max-failed-login-attempts: ${MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lockout-minutes: ${ACCOUNT_LOCKOUT_MINUTES:30}
    password-reset-token-validity-minutes: ${PASSWORD_RESET_VALIDITY_MINUTES:30}
    bcrypt-strength: 12
    refresh-cookie-name: refresh_token
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    # Requests per source IP to the credential endpoints. Account lockout stops
    # one attacker guessing at one account; this bounds the opposite shape, one
    # password sprayed across many accounts.
    auth-rate-limit:
      max-requests: ${AUTH_RATE_LIMIT_MAX:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    refresh-cookie-same-site: Strict

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    # Content-Disposition must be exposed or a browser download cannot read the
    # filename the server chose, and every export saves as a guessed name.
    exposed-headers: X-Request-Id,Content-Disposition
    allow-credentials: true
    max-age: 3600

  company:
    default-timezone: ${COMPANY_TIMEZONE:Asia/Kolkata}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.company.attendance: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
