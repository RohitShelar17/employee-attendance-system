spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.company.attendance: INFO
    org.hibernate.SQL: WARN

app:
  security:
    # HTTPS is mandatory in production, so the refresh cookie must be Secure.
    refresh-cookie-secure: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
